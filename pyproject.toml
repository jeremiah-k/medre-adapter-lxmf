[project]
name = "medre-adapter-lxmf"
version = "0.1.0"
description = "lxmf transport adapter for MEDRE"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["medre>=0.1.0", 'lxmf==1.2.1', 'rns==1.5.7']

[project.entry-points."medre.adapters"]
lxmf = "medre.adapters.lxmf.plugin:adapter_spec"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
